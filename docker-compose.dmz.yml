networks:
  net_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  # Rede compartilhada com a VM interna (WAF -> e-commerce)
  net_interna:
    external: true

services:

  # ─────────────────────────────────────────────
  # Suricata IDS/IPS
  # ─────────────────────────────────────────────
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    networks:
      net_dmz:
        ipv4_address: 172.20.0.30
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./dmz/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./dmz/suricata/rules:/etc/suricata/rules
      - suricata_logs:/var/log/suricata
    # -i eth0: interface padrão do container Docker (ou definida via SURICATA_IFACE)
    command: -c /etc/suricata/suricata.yaml -i ${SURICATA_IFACE:-eth0} --pidfile /var/run/suricata.pid
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ModSecurity WAF (NGINX + OWASP CRS)
  # ─────────────────────────────────────────────
  modsecurity-waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: modsecurity-waf
    networks:
      net_dmz:
        ipv4_address: 172.20.0.10
      net_interna: {}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      # Montar no diretorio de regras pós-CRS do OWASP CRS (carregamento automático)
      - ./dmz/modsecurity/modsecurity.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ./dmz/modsecurity/init-logs.sh:/docker-entrypoint.d/00-init-logs.sh:ro
      - modsec_logs:/var/log/nginx
    environment:
      - SERVER_NAME=ecommerce.farmacia.local
      - BACKEND=${BACKEND_URL:-http://ecommerce:5000}
      - MODSEC_RULE_ENGINE=on
      - MODSEC_RESP_BODY_ACCESS=on
      - MODSEC_RESP_BODY_MIMETYPE=text/plain text/html text/xml application/json
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - DNS_SERVER=127.0.0.11
      - LOGLEVEL=warn
      - ERRORLOG=/var/log/nginx/error.log
      - ACCESSLOG=/var/log/nginx/access.log
      - METRICSLOG=/dev/stdout
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Wazuh Agent (DMZ) — envia logs ao Wazuh Manager
  # ─────────────────────────────────────────────
  wazuh-agent-dmz:
    image: wazuh/wazuh-agent:4.14.7
    container_name: wazuh-agent-dmz
    networks:
      net_dmz:
        ipv4_address: 172.20.0.20
      net_interna: {}
    environment:
      - WAZUH_MANAGER_SERVER=${WAZUH_MANAGER_IP:-wazuh-manager}
      - WAZUH_AGENT_NAME=agent-dmz
    volumes:
      - ./dmz/wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - suricata_logs:/var/log/suricata:ro
      - modsec_logs:/var/log/nginx:ro
    restart: unless-stopped

volumes:
  suricata_logs:
  modsec_logs:


