# ============================================================
# Regras Customizadas WAF / DLP -- Rede de Farmacias (LGPD)
# Carregadas automaticamente apos as regras do OWASP CRS
# ============================================================

# DLP-001: Bloquear CPF no corpo da RESPOSTA (previne vazamento de PII)
SecRule RESPONSE_BODY "@rx \b\d{3}[\.\-]?\d{3}[\.\-]?\d{3}[\-]?\d{2}\b" "id:9001,phase:4,deny,status:403,log,auditlog,msg:'DLP: CPF detectado no corpo da resposta - possivel vazamento de PII',tag:'FARMACIA/DLP',tag:'LGPD',severity:'CRITICAL'"

# DLP-002: Bloquear numero de cartao de credito no corpo da RESPOSTA
SecRule RESPONSE_BODY "@rx \b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|6(?:011|5[0-9]{2})[0-9]{12})\b" "id:9002,phase:4,deny,status:403,log,auditlog,msg:'DLP: Numero de cartao de credito detectado na resposta',tag:'FARMACIA/DLP',tag:'LGPD',severity:'CRITICAL'"

# DLP-003: Alertar (nao bloquear) prontuario medico padrao CID no corpo da RESPOSTA
SecRule RESPONSE_BODY "@rx \b[A-Z][0-9]{2}(?:\.[0-9]{1,2})?\b" "id:9003,phase:4,pass,log,auditlog,msg:'DLP INFO: Possivel codigo CID detectado na resposta - revisar',tag:'FARMACIA/DLP',tag:'LGPD',severity:'WARNING'"

# WAF-001: Bloquear tentativas de path traversal
SecRule REQUEST_URI "@rx (\.\.\/|\.\.\\\\)" "id:9010,phase:1,deny,status:400,log,msg:'Path Traversal Attempt',tag:'FARMACIA/WAF',severity:'ERROR'"

# WAF-002: Bloquear user agents de ferramentas de ataque conhecidas
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nmap masscan nuclei" "id:9011,phase:1,deny,status:403,log,msg:'Ferramenta de ataque detectada no User-Agent',tag:'FARMACIA/WAF',severity:'ERROR'"