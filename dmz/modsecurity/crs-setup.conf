# ============================================================
# CRS Setup — OWASP Core Rule Set
# Configuração ajustada para o e-commerce da farmácia
# ============================================================

# Modo de detecção: anomaly scoring
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Limiar de anomalia (menor = mais restritivo)
# 5 = bloqueia ataques médios e acima
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0-rc1',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Modo de detecção (não bloqueante inicialmente para tuning)
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900001,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.detection_paranoia_level=2"

# Habilitar proteção de método HTTP
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:'tx.allowed_methods=GET HEAD POST PUT DELETE OPTIONS'"

# Encoding permitido
SecAction \
    "id:900230,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded||multipart/form-data||text/xml||application/xml||application/soap+xml||application/json||application/octet-stream|'"
