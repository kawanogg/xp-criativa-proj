# ============================================================
# nginx.conf — ModSecurity WAF / Proxy Reverso
# Protege o e-commerce na rede interna
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Log format estruturado para o Wazuh ──
    log_format wazuh_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time}';

    access_log /var/log/nginx/access.log wazuh_json;

    sendfile on;
    keepalive_timeout 65;

    # ── Ocultar versão do NGINX nos headers ──
    server_tokens off;

    # ── Rate limiting — proteção contra DDoS/força bruta ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── Upstream — e-commerce na rede interna ──
    upstream ecommerce_backend {
        server ecommerce:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name ecommerce.farmacia.local;

        # ── ModSecurity ativo ──
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/modsecurity-override.conf;

        # ── Headers de segurança ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Endpoint de login — rate limit mais restrito ──
        location /api/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://ecommerce_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Endpoints de API ──
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ecommerce_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── DLP: bloquear CPF no corpo da resposta ──
            # (Implementado via regras ModSecurity no modsecurity.conf)
        }

        # ── Proxy geral ──
        location / {
            proxy_pass http://ecommerce_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Bloquear acesso a arquivos sensíveis ──
        location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|bak|conf)$ {
            deny all;
            return 404;
        }

        # ── Health check interno ──
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
